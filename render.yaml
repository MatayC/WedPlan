# Render.com Blueprint für die WedPlan Blazor Web App.
# Kostenloser Web Service (Free Tier), Docker-basiert.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: wedplan
    runtime: docker
    plan: free
    # Pfad zum Dockerfile im Repo-Root.
    dockerfilePath: ./Dockerfile
    # Health-Check-Pfad, damit Render den Dienst als "healthy" erkennt.
    healthCheckPath: /
    envVars:
      # ASP.NET Core Umgebung auf Produktion setzen.
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Supabase-Zugangsdaten – im Render-Dashboard eintragen (nicht ins Repo committen!).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
