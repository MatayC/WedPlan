<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WedPlan – Offline</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --rose: #D6A6AC;
            --cream: #FDF6F0;
            --gold: #C9A96E;
            --text: #3d2b2b;
        }

        html, body {
            height: 100%;
            background: var(--cream);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 380px;
        }

        .heart {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--rose);
            margin-bottom: 0.75rem;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #7a5c5c;
            margin-bottom: 2rem;
        }

        button {
            background: linear-gradient(135deg, var(--rose), #B75A67);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 0.875rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(214,166,172,0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        button:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(214,166,172,0.4);
        }

        .divider {
            margin: 1.5rem auto;
            width: 60px;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
        }

        .tip {
            font-size: 0.85rem;
            color: #a08080;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">💍</div>
        <h1>Keine Verbindung</h1>
        <div class="divider"></div>
        <p>
            Dein WedPlan ist gerade offline.<br />
            Stelle eine Internetverbindung her und lade die App neu.
        </p>
        <button onclick="window.location.reload()">
            Erneut versuchen
        </button>
        <p class="tip" style="margin-top: 1.5rem;">
            💡 Tipp: Bereits geladene Seiten stehen weiterhin zur Verfügung.
        </p>
    </div>
</body>
</html>
